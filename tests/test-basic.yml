name: Test basic chromedriver setup (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert chromedriver is installed and executable
        run: |
          echo "Checking chromedriver is on PATH..."
          if ! command -v chromedriver &>/dev/null; then
            echo "FAIL: chromedriver not found on PATH"
            exit 1
          fi
          echo "chromedriver found at: $(command -v chromedriver)"
          echo "PASS: chromedriver is installed"
      - name: Assert chromedriver reports a version
        run: |
          VERSION_OUTPUT=$(chromedriver --version 2>&1 || true)
          echo "chromedriver --version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: chromedriver --version produced no output"
            exit 1
          fi
          echo "PASS: chromedriver version reported"
