name: Test chromedriver setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          chromedriver-version: "114.0.5735.90"
      - name: Assert chromedriver is installed
        run: |
          echo "Checking chromedriver is on PATH..."
          if ! command -v chromedriver &>/dev/null; then
            echo "FAIL: chromedriver not found on PATH"
            exit 1
          fi
          echo "chromedriver found at: $(command -v chromedriver)"
          echo "PASS: chromedriver is installed"
      - name: Assert chromedriver version matches requested version
        run: |
          VERSION_OUTPUT=$(chromedriver --version 2>&1 || true)
          echo "chromedriver --version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "114"; then
            echo "PASS: chromedriver version 114 is installed"
          else
            echo "FAIL: expected version 114 but got: $VERSION_OUTPUT"
            exit 1
          fi
